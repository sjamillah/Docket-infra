name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and verify packaging
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Keyed on requirements.txt, so cfn-lint comes from cache.
          cache: pip

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install
        run: pip install -r requirements.txt

      # Git sync has already deployed the commit you pushed. This is the check
      # that the packaged file in it was honest, not a gate. Repackaging must
      # be a no-op, or main.packaged.yaml is stale.
      - name: Verify
        run: make verify

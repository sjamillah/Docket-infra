AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: docket VPC endpoints - what replaces a NAT gateway

# Why the private subnets need no NAT gateway, at ~$32 per AZ per month.

Mappings:
  # Keys become the logical ids (VpcEndpointEcrApi and so on); Service holds the
  # name, which cannot be a logical id because of the dots.
  EndpointServices:
    EcrApi:
      Service: ecr.api
      Label: ecr-api
    EcrDkr:
      Service: ecr.dkr
      Label: ecr-dkr
    Logs:
      Service: logs
      Label: logs
    Monitoring:
      Service: monitoring
      Label: monitoring
    SecretsManager:
      Service: secretsmanager
      Label: secrets
    SsmMessages:
      Service: ssmmessages
      Label: ssm-messages

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RouteTableIds:
    Type: CommaDelimitedList
  EndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:

  # Free, and required for ECR pulls: image layers are stored in S3.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        !Ref RouteTableIds

  # api and dkr for pulls, logs, monitoring, secretsmanager, ssmmessages for Exec.
  Fn::ForEach::InterfaceEndpoints:
    - Name
    - - EcrApi
      - EcrDkr
      - Logs
      - Monitoring
      - SecretsManager
      - SsmMessages
    - VpcEndpoint${Name}:
        Type: AWS::EC2::VPCEndpoint
        Metadata:
          cfn-lint:
            config:
              # E3064 cannot resolve the name through FindInMap; these are distinct.
              ignore_checks:
                - E3064
        Properties:
          VpcId: !Ref VpcId
          ServiceName: !Sub
            - 'com.amazonaws.${AWS::Region}.${Svc}'
            - Svc: !FindInMap
                - EndpointServices
                - !Ref Name
                - Service
          VpcEndpointType: Interface
          PrivateDnsEnabled: true
          SubnetIds:
            !Ref AppSubnetIds
          SecurityGroupIds:
            - !Ref EndpointSecurityGroupId
          # Credentials from another account cannot route through these, which
          # is the one restriction the task role cannot express.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Principal: '*'
                Action: '*'
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:PrincipalAccount': !Ref AWS::AccountId
          Tags:
            - Key: Name
              Value: !Sub
                - '${ProjectName}-${Suffix}'
                - Suffix: !FindInMap
                    - EndpointServices
                    - !Ref Name
                    - Label

AWSTemplateFormatVersion: '2010-09-09'
Description: docket CodePipeline - EventBridge trigger and CodeDeploy hand-off

Parameters:
  ProjectName:
    Type: String

  ArtifactBucketName:
    Type: String

  PipelineName:
    Type: String

  AlertTopicArn:
    Type: String

  DeployConfigObjectKey:
    Type: String
    Description: >-
      Zip the app repo's workflow uploads, holding taskdef.json and
      appspec.yaml. The app owns its deploy descriptors; this stack only
      needs to know where they land.

  PipelineRoleArn:
    Type: String

  EventBridgeRoleArn:
    Type: String

  EcrRepositoryName:
    Type: String

  TriggerImageTag:
    Type: String

  CodeDeployApplicationName:
    Type: String

  CodeDeployDeploymentGroupName:
    Type: String

Resources:

  # --- Pipeline -------------------------------------------------------------

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !Ref PipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            # Produces imageDetail.json, carrying the digest that gets deployed.
            - Name: Image
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: !Ref TriggerImageTag
              OutputArtifacts:
                - Name: ImageArtifact

            # Uploaded by the app repo's workflow in the same run that pushes
            # the image, so the descriptors always match the image that
            # triggers the deployment.
            - Name: DeployConfig
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref ArtifactBucketName
                S3ObjectKey: !Ref DeployConfigObjectKey
                # Only an image push starts a deployment. Without this the
                # upload itself would start a second, racing execution.
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: ConfigArtifact

        - Name: Deploy
          Actions:
            - Name: BlueGreen
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              InputArtifacts:
                - Name: ConfigArtifact
                - Name: ImageArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplicationName
                DeploymentGroupName: !Ref CodeDeployDeploymentGroupName
                TaskDefinitionTemplateArtifact: ConfigArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: ConfigArtifact
                AppSpecTemplatePath: appspec.yaml
                # Substitutes the digest from imageDetail.json into the
                # IMAGE1_NAME placeholder in taskdef.json.
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME

  # --- Triggers and notifications -------------------------------------------

  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-ecr-push'
      Description: Starts the deployment pipeline when a new image lands
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepositoryName
          # :latest is the only tag, so this matches the one event a build emits.
          image-tag:
            - !Ref TriggerImageTag
      Targets:
        - Id: codepipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !Ref EventBridgeRoleArn

  PipelineFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-pipeline-failed'
      Description: Notify when a pipeline execution fails
      State: ENABLED
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - CodePipeline Pipeline Execution State Change
        detail:
          pipeline:
            - !Ref Pipeline
          state:
            - FAILED
      Targets:
        - Id: alert
          Arn: !Ref AlertTopicArn
          InputTransformer:
            InputPathsMap:
              pipeline: '$.detail.pipeline'
              execution: '$.detail.execution-id'
            InputTemplate: '"Deployment FAILED. Pipeline: <pipeline> Execution: <execution>"'

Outputs:
  PipelineName:
    Value: !Ref Pipeline

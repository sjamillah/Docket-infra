AWSTemplateFormatVersion: '2010-09-09'
Description: docket CloudWatch alarms - the ones that notify, not the ones that block

# Notify only. The alarms that gate a deployment are in codedeploy.yaml.

Parameters:
  ProjectName:
    Type: String
  AlertTopicArn:
    Type: String
  DbInstanceIdentifier:
    Type: String
  ProxyName:
    Type: String
  CacheReplicationGroupId:
    Type: String
  LoadBalancerFullName:
    Type: String
  TargetGroupBlueFullName:
    Type: String
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  MaxCapacity:
    Type: Number

Resources:

  # --- Database -------------------------------------------------------------

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-db-cpu'
      AlarmDescription: Database CPU sustained above 80 percent
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

  DbFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-db-free-storage'
      AlarmDescription: Under 2 GiB free, so storage autoscaling should have fired
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      # Missing data means the instance is not reporting at all.
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopicArn

  # --- Proxy ----------------------------------------------------------------

  # If the proxy is queueing, its pool is exhausted and requests are waiting.
  ProxyBorrowLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-proxy-borrow-latency'
      AlarmDescription: Tasks are waiting to borrow a pooled connection
      Namespace: AWS/RDS
      MetricName: DatabaseConnectionsBorrowLatency
      Dimensions:
        - Name: ProxyName
          Value: !Ref ProxyName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      # Microseconds. A healthy borrow is near zero.
      Threshold: 100000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

  # --- Cache ----------------------------------------------------------------

  CacheEvictionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-cache-evictions'
      AlarmDescription: Redis is evicting, so the node is too small for the working set
      Namespace: AWS/ElastiCache
      MetricName: Evictions
      Dimensions:
        - Name: ReplicationGroupId
          Value: !Ref CacheReplicationGroupId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

  # Fails silently: reads fall through to PostgreSQL and everything still works.
  CacheHitRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-cache-hit-rate'
      AlarmDescription: Cache hit rate below 70 percent
      Namespace: AWS/ElastiCache
      MetricName: CacheHitRate
      Dimensions:
        - Name: ReplicationGroupId
          Value: !Ref CacheReplicationGroupId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 0.7
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

  # --- Load balancer --------------------------------------------------------

  # Not a gate: during a cutover the green group is briefly unhealthy.
  UnhealthyBlueTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-unhealthy-targets-blue'
      AlarmDescription: One or more blue targets failing health checks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupBlueFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

  # --- Service capacity -----------------------------------------------------

  NoRunningTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-no-running-tasks'
      AlarmDescription: Service below its minimum capacity
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref ServiceName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # Missing data means the service is not reporting at all.
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopicArn

  MaxCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-at-max-capacity'
      AlarmDescription: Auto scaling has hit its ceiling
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref ServiceName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref MaxCapacity
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
